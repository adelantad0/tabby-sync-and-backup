name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build plugin
        run: npm run build:prod || npm run build

      - name: Package release artifact
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          tar -czf "tabby-sync-and-backup-v${VERSION}.tar.gz" dist package.json README.md CHANGELOG.md

      - name: Extract Changelog entry
        id: changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          # Extract the section corresponding to the tag version from CHANGELOG.md
          python3 -c "
          import re, sys
          version = '${VERSION}'
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          pattern = r'## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          notes = match.group(1).strip() if match else 'Release v' + version
          with open('release_notes.txt', 'w') as out:
              out.write(notes)
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: release_notes.txt
          files: |
            tabby-sync-and-backup-*.tar.gz
            dist/index.js
          draft: false
          prerelease: false

      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
